<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="fontawesome-free-7.3.1-web/css/all.min.css">
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        .con{
            height: 100vh;
            /* border: 1px solid black; */
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .box{
            height: 80%;
            width: 80%;
            /* border: 1px solid black; */
            display: flex;
        }
        .left,.right,.center{
            height: 100%;
            /* border: 1px solid black; */
        }
        .left{
            width: 3%;
            background-color: navy;
            border-radius: 20px;
        }
        .center{
            width: 62%;
            font-size: 67px;
            font-family: 'Times New Roman', Times, serif;
            color: navy;
        }
        .center>h1{
            margin-left: 20px;
            margin-top: 65px;
        }
        .right{
            width: 35%;
            box-shadow: 10px 10px 10px;
            border-radius: 20px;
        }
        .top{
            height: 30%;
            /* border: 1px solid black; */
        }
        .bottom{
            height: 70%;
            /* border: 1px solid black; */
        }
        .top-in{
            height: 90%;
            /* border: 1px solid black; */
            background-color: navy;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
        }
        .circle{
            height: 125px;
            width: 125px;
            border: 5px solid navy;
            border-radius: 50%;
            position: absolute;
            top: 15%;
            right: 20%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        img{
            height: 100%;
            width: 100%;
            border-radius: 50%;
            border: 3px solid white;
        }
        .bottom>h1{
            text-align: center;
            font-size: 30px;
            margin-bottom: 10px;
        }
        .button{
            height: 20%;
            /* border: 1px solid black; */
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            color: white;
        }
        .b1,.b2{
            height: 50%;
            width: 40%;
            background-color: navy;
            text-align: center;
            line-height: 40px;
            border-radius: 20PX;
        }
        .icon{
            height: 20%;
            display: flex;
            align-items: center;
            justify-content: space-evenly;
        }
        .fa-facebook{
            color: blue;
        }
        .fa-instagram{
            background: linear-gradient(red, orange);
            color: transparent;
            background-clip: text;
        }
        .fa-github{
            color: violet;
        }
        .fa-linkedin{
            color: rgb(46, 132, 167);
        }
        .fa-heart{
            color: red;
        }
    </style>
</head>
<body>
    <div class="con">
        <div class="box">
            <div class="left"></div>
            <div class="center"><h1>Profile Card UI UX Design</h1></div>
            <div class="right">
                <div class="top">
                    <div class="top-in">
                        <div class="circle">
                            <img src="Capture.PNG" alt="">
                        </div>
                    </div>
                </div>
                <div class="bottom">
                    <h1>Website Developer</h1>
                    <h1>Dezyne École College</h1>
                    <h1>BCA 1st Year</h1>
                    <div class="icon">
                        <i class="fa fa-brands fa-2x fa-facebook"></i>
                        <i class="fa fa-brands fa-2x fa-instagram"></i>
                        <i class="fa fa-brands fa-2x fa-github"></i>
                        <i class="fa fa-brands fa-2x fa-linkedin"></i>
                        <i class="fa fa-brands fa-2x fa-behance"></i>
                    </div>
                    <div class="button">
                        <div class="b1">Subscribe</div>
                        <div class="b2">Message</div>
                    </div>
                    <div class="icon">
                        <i class="fa fa-solid fa-heart"></i>60.4k
                        <i class="fa fa-solid fa-comment"></i>20k
                        <i class="fa fa-solid fa-share fa-flip-horizontal"></i>12.6k
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
